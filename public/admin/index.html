<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width">
<meta name="robots" content="noindex">
<!-- No external scripts or fonts on this page: it handles a GitHub token, so only our own inline script may run. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<link href="/style.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
<section class="page wide">
<section class="column">
<h1>Admin</h1>
<p><label>GitHub token<br><input id="token" type="password" autocomplete="off"></label></p>
<p class="target">The token is only held in this page’s memory. It’s never stored, and it’s gone when you close or reload the page. Use a fine-grained token limited to this repository with Contents read &amp; write.</p>
<p id="status" role="status"></p>

<h2>Edit or review a link</h2>
<form id="load-form" autocomplete="off">
<p><label>Short path<br><input id="edit-path" type="text" autocapitalize="off" spellcheck="false" placeholder="e.g. wishlist/joey"></label></p>
<p><button class="button" type="submit">Load</button> <button class="button" type="button" id="review-list">Show links needing review</button></p>
</form>
<ul id="review-items"></ul>
<form id="edit-form" autocomplete="off" hidden>
<p>Editing <strong id="edit-title"></strong></p>
<p id="edit-flags"></p>
<p><label>Target URL<br><input id="edit-target" type="url" required></label></p>
<p id="edit-history-label" hidden>Used to point to:</p>
<ul id="edit-history"></ul>
<p><button class="button" type="submit">Save new target</button> <button class="button" type="button" id="approve" hidden>Approve current target</button></p>
</form>

<h2>Add a link</h2>
<form id="form" autocomplete="off">
<p><label>Short path (leave blank to auto-assign)<br><input id="path" type="text" autocapitalize="off" spellcheck="false" placeholder="e.g. wishlist/joey"></label></p>
<p><button class="button" type="button" id="suggest">Suggest a short path</button></p>
<p><label>Target URL<br><input id="target" type="url" placeholder="https://…" required></label></p>
<p><button class="button" type="submit">Add link</button></p>
</form>
</section>
</section>
<script>
const REPO = 'joeyday/jday.co';
const API = `https://api.github.com/repos/${REPO}/contents/links.json`;

function validTarget(raw) {
  const target = raw.trim();
  let url;
  try { url = new URL(target); } catch { throw new Error('That target isn’t a valid URL.'); }
  if (!/^https?:$/.test(url.protocol)) throw new Error('The target must be http or https.');
  return target;
}

const findLink = (links, path) => links.find((l) => l.path.toLowerCase() === path.trim().replace(/^\/+|\/+$/g, '').toLowerCase());
// Same condition the build uses for the "this link was redirected" warning page.
const needsReview = (l) => !l.broken && l.history?.length && !l.approved;

// Changing a target works like a checker update: the old one goes on the front of `history`. Since
// the change is deliberate it's approved right away, and the stale `broken` flag is dropped (the
// weekly check will re-flag it if the new target is dead too).
function retarget(links, path, rawTarget, today) {
  const link = findLink(links, path);
  if (!link) throw new Error(`No link at jday.co/${path}.`);
  const target = validTarget(rawTarget);
  if (target === link.target) throw new Error('The target didn’t change.');
  link.history = [{ target: link.target, replaced: today }, ...(link.history ?? [])];
  link.target = target;
  link.approved = true;
  delete link.broken;
  return link;
}

function approve(links, path) {
  const link = findLink(links, path);
  if (!link) throw new Error(`No link at jday.co/${path}.`);
  if (!needsReview(link)) throw new Error('That link doesn’t need approval.');
  link.approved = true;
  return link;
}

// Returns the new link entry, or throws a message-bearing Error. Mirrors the checks in scripts/build.mjs.
function newLink(links, rawPath, rawTarget, today) {
  const path = rawPath.trim().replace(/^\/+|\/+$/g, '');
  if (!path) throw new Error('Enter a path.');
  const segments = path.split('/');
  if (segments.some((s) => !s || s === '.' || s === '..')) throw new Error('That path has an empty or dot segment.');
  if (/[?#\s]/.test(path)) throw new Error('Paths can’t contain spaces, ? or #.');
  if (segments.some((s) => s.toLowerCase() === 'info')) throw new Error('“info” is reserved.');
  if (segments[0].toLowerCase() === 'admin') throw new Error('“admin” is reserved.');
  const target = validTarget(rawTarget);
  if (links.some((l) => l.path.toLowerCase() === path.toLowerCase())) throw new Error(`jday.co/${path} already exists.`);
  return { id: Math.max(0, ...links.map((l) => l.id)) + 1, path, target, created: today, clicks: 0 };
}

// Chunked: spreading the whole file into one call can exceed the engine's argument limit.
// Lowercase only: the site treats paths case-insensitively (the build lowercases them), and GitHub Pages
// is case-sensitive, so mixed-case codes wouldn't resolve. 36 characters, not 62.
const ALPHABET = 'abcdefghijklmnopqrstuvwxyz0123456789';
const MIN_LENGTH = 2;
const RESERVED = ['info', 'admin'];

// Picks a uniformly random unused code of the shortest length that has any free. Instead of building
// the list of free codes, it treats each code as a base-36 number, draws a random rank r among the
// free ones, and shifts r past each used number at or below it (used sorted ascending).
function pickCode(links) {
  const base = ALPHABET.length;
  const toNumber = (code) => {
    let n = 0;
    for (const ch of code) {
      const digit = ALPHABET.indexOf(ch);
      if (digit < 0) return -1;
      n = n * base + digit;
    }
    return n;
  };
  const taken = links.map((l) => l.path.toLowerCase()).concat(RESERVED);
  for (let length = MIN_LENGTH; ; length++) {
    const used = [...new Set(taken.filter((p) => p.length === length).map(toNumber).filter((n) => n >= 0))].sort((a, b) => a - b);
    const free = base ** length - used.length;
    if (free <= 0) continue;
    let rank = Math.floor(Math.random() * free);
    for (const n of used) {
      if (n <= rank) rank++;
      else break;
    }
    let code = '';
    for (let i = 0; i < length; i++, rank = Math.floor(rank / base)) code = ALPHABET[rank % base] + code;
    return code;
  }
}

const bytesToBase64 = (s) => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(bin);
};
const base64ToText = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), (c) => c.charCodeAt(0)));

async function github(token, options = {}) {
  const res = await fetch(API, { ...options, headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', ...options.headers } });
  if (!res.ok) {
    const detail = res.status === 401 ? 'GitHub rejected the token.' : res.status === 403 || res.status === 404 ? 'The token can’t write to this repository (check its scope).' : res.status === 409 ? 'links.json changed while saving; try again.' : `GitHub said ${res.status}.`;
    throw new Error(detail);
  }
  return res.json();
}

async function loadLinks(token) {
  const file = await github(token);
  return { file, links: JSON.parse(base64ToText(file.content)) };
}

const $ = (id) => document.getElementById(id);
const say = (msg) => { $('status').textContent = msg; };
const localToday = () => {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
};
const token = () => {
  const t = $('token').value.trim();
  if (!t) throw new Error('Enter the token first.');
  return t;
};

// Loads links.json, applies `change` to it, and commits the result. Everything is re-read first, so
// an edit never overwrites a newer version; GitHub rejects a stale write with a 409.
async function commit(message, change) {
  const { file, links } = await loadLinks(token());
  const result = change(links);
  await github(token(), {
    method: 'PUT',
    body: JSON.stringify({ message: typeof message === 'function' ? message(result) : message, content: bytesToBase64(JSON.stringify(links, null, 2) + '\n'), sha: file.sha }),
  });
  return result;
}

// Run an async handler with the form's buttons disabled and any error shown in the status line.
const guarded = (handler) => async (e) => {
  e?.preventDefault();
  const buttons = [...document.querySelectorAll('button')];
  buttons.forEach((b) => { b.disabled = true; });
  try { await handler(e); } catch (err) { say(err.message); } finally { buttons.forEach((b) => { b.disabled = false; }); }
};

// ---- Edit / review
let editing = null; // path of the loaded link

function showLink(link) {
  editing = link.path;
  $('edit-form').hidden = false;
  $('edit-title').textContent = `jday.co/${link.path}`;
  $('edit-path').value = link.path;
  $('edit-target').value = link.target;
  const flags = [];
  if (link.broken) flags.push('Flagged broken by the link checker.');
  if (needsReview(link)) flags.push('Updated by the link checker and not yet approved: visitors see a warning page.');
  $('edit-flags').textContent = flags.join(' ');
  $('approve').hidden = !needsReview(link);
  const list = $('edit-history');
  list.replaceChildren(...(link.history ?? []).map((h) => {
    const li = document.createElement('li');
    li.className = 'target';
    li.textContent = `${h.target} (until ${h.replaced})`;
    return li;
  }));
  $('edit-history-label').hidden = !link.history?.length;
}

async function load(path) {
  const { links } = await loadLinks(token());
  const link = findLink(links, path);
  if (!link) throw new Error(`No link at jday.co/${path.trim()}.`);
  showLink(link);
  say('');
}

$('load-form').addEventListener('submit', guarded(() => load($('edit-path').value)));

$('review-list').addEventListener('click', guarded(async () => {
  const { links } = await loadLinks(token());
  const pending = links.filter(needsReview).sort((a, b) => a.path.localeCompare(b.path));
  $('review-items').replaceChildren(...pending.map((l) => {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'button';
    button.textContent = l.path;
    button.addEventListener('click', guarded(() => load(l.path)));
    li.append(button);
    return li;
  }));
  say(pending.length ? `${pending.length} link${pending.length === 1 ? '' : 's'} need review.` : 'Nothing needs review.');
}));

$('edit-form').addEventListener('submit', guarded(async () => {
  say('Saving…');
  const path = editing;
  const link = await commit(`Retarget ${path}`, (links) => retarget(links, path, $('edit-target').value, localToday()));
  showLink(link);
  say(`Updated jday.co/${path}. It will be live in a minute or two, once the site redeploys.`);
}));

$('approve').addEventListener('click', guarded(async () => {
  say('Saving…');
  const path = editing;
  const link = await commit(`Approve ${path}`, (links) => approve(links, path));
  showLink(link);
  say(`Approved jday.co/${path}. It will redirect straight through once the site redeploys.`);
}));

// ---- Add
$('suggest').addEventListener('click', guarded(async () => {
  say('Looking…');
  $('path').value = pickCode((await loadLinks(token())).links);
  say('Suggested a path. Edit it if you like, or press the button again for another.');
}));

$('form').addEventListener('submit', guarded(async () => {
  say('Saving…');
  const link = await commit((added) => `Add link ${added.path}`, (links) => {
    const added = newLink(links, $('path').value.trim() || pickCode(links), $('target').value, localToday());
    links.push(added);
    return added;
  });
  say(`Added jday.co/${link.path}. It will be live in a minute or two, once the site redeploys.`);
  $('path').value = '';
  $('target').value = '';
}));

// Arriving from a link's info page (/admin/?path=…): prefill the path, then it just needs the token.
const requested = new URLSearchParams(location.search).get('path');
if (requested) {
  $('edit-path').value = requested;
  say('Enter the token, then press Load to edit jday.co/' + requested + '.');
}
</script>
</body>
</html>
